<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가족 여행기록</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<style>
  :root {
    --bg: #f5f7fb; --card: #fff; --text: #1d2433; --muted: #6b7489; --line: #e3e7ef;
    --accent: #2563eb; --accent-soft: #e8efff; --warn: #fff4c2; --danger: #d93b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: var(--bg); color: var(--text); font-size: 15px; }
  header { background: var(--accent); color: #fff; padding: 18px 16px 0; }
  header h1 { margin: 0 0 12px; font-size: 20px; }
  nav { display: flex; gap: 4px; }
  nav button { flex: 1; border: 0; background: transparent; color: #dbe6ff; padding: 10px 0; font-size: 15px;
               border-bottom: 3px solid transparent; cursor: pointer; }
  nav button.on { color: #fff; border-bottom-color: #fff; font-weight: 700; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .hidden { display: none !important; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .person h2 { margin: 0 0 10px; font-size: 17px; }
  .person h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 6px; margin-bottom: 10px; }
  .nums b { display: block; font-size: 24px; color: var(--accent); }
  .nums span { font-size: 12px; color: var(--muted); }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); border-radius: 999px;
          padding: 3px 9px 3px 5px; font-size: 13px; white-space: nowrap; }
  .chip img, .flag { width: 20px; height: 14px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .chip .x { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 0 0 2px; font-size: 14px; }
  .chip.unknown { background: #ffe1e1; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .missing { color: #a66b00; font-size: 12px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.c, th.c { text-align: center; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .pill.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .trip { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 12px 0;
          border-bottom: 1px solid var(--line); cursor: pointer; }
  .trip:last-child { border-bottom: 0; }
  .trip.todo { background: var(--warn); margin: 0 -16px; padding: 12px 16px; }
  .trip .when { font-weight: 600; }
  .trip .who { color: var(--muted); font-size: 13px; }
  .trip .memo { color: var(--muted); font-size: 12px; margin-top: 4px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type=date], input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid var(--line);
          border-radius: 10px; font-size: 15px; font-family: inherit; background: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { border: 0; background: var(--accent); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 15px;
         cursor: pointer; font-weight: 600; }
  .btn.ghost { background: #eef1f6; color: var(--text); }
  .btn.danger { background: #fdeaea; color: var(--danger); }
  .btn:disabled { opacity: .5; }
  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .picked { margin-top: 8px; min-height: 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2433; color: #fff;
           padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center;
          color: var(--muted); cursor: pointer; background: #fafbfd; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop input { display: none; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #certTable input[type=date] { padding: 6px 4px; font-size: 14px; min-width: 0; width: 100%; }
  #certTable td:nth-child(1), #certTable td:nth-child(2) { width: 42%; }
  #certTable tr.warnrow td { border-bottom: 1px solid var(--line); padding-top: 0; }
  #certTable td { padding: 4px 2px; }
  .delx { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; padding: 4px; }
  .tag { font-size: 12px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.new { background: #e3f6e8; color: #1e7b3a; }
  .tag.dup { background: #eef1f6; color: var(--muted); }
  .tag.warn { background: #ffe1e1; color: var(--danger); }
  .privacy { background: #f0f5ff; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #34405a; margin-bottom: 4px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
<header>
  <h1>✈️ 우리 가족 여행기록</h1>
  <nav>
    <button data-tab="stats" class="on">통계</button>
    <button data-tab="trips">여행 목록</button>
    <button data-tab="form">+ 추가</button>
    <button data-tab="cert">📄 증명서</button>
  </nav>
</header>

<main>
  <div id="loading" class="loading">불러오는 중…</div>

  <!-- 통계 -->
  <section id="tab-stats" class="hidden">
    <div id="people" class="grid"></div>
    <div class="card">
      <h3 style="margin-top:0">🌏 나라별 방문 횟수</h3>
      <div style="overflow-x:auto"><table id="countryTable"></table></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">📅 연도별 출국 횟수</h3>
      <div style="overflow-x:auto"><table id="yearTable"></table></div>
    </div>
  </section>

  <!-- 여행 목록 -->
  <section id="tab-trips" class="hidden">
    <div class="filters" id="personFilter"></div>
    <div class="card" id="tripList"></div>
  </section>

  <!-- 추가 / 수정 -->
  <section id="tab-form" class="hidden">
    <div class="card">
      <h3 style="margin-top:0" id="formTitle">여행 추가</h3>
      <label>누가 갔나요? <span id="peopleHint">(같이 간 사람 모두 선택)</span></label>
      <div class="filters" id="peoplePick"></div>
      <div class="row2">
        <div><label>출국일</label><input type="date" id="dep"></div>
        <div><label>입국일</label><input type="date" id="ret"></div>
      </div>
      <label>다녀온 나라 (여러 나라면 하나씩 추가)</label>
      <input type="text" id="countryInput" list="countryList" placeholder="예: 일본, 다낭, 발리 … 입력 후 Enter">
      <datalist id="countryList"></datalist>
      <div class="flags picked" id="picked"></div>
      <label>메모</label>
      <input type="text" id="memo" placeholder="예: 가족여행, 출장">
      <div class="actions">
        <button class="btn" id="saveBtn">저장</button>
        <button class="btn ghost hidden" id="cancelBtn">취소</button>
        <button class="btn danger hidden" id="deleteBtn">삭제</button>
      </div>
    </div>
  </section>

  <!-- 출입국증명서 불러오기 -->
  <section id="tab-cert" class="hidden">
    <div class="card">
      <h3 style="margin-top:0">📄 출입국증명서로 한 번에 불러오기</h3>
      <div class="privacy">🔒 증명서 파일은 <b>이 휴대폰/컴퓨터 안에서만</b> 읽어요. 주민번호·여권번호는 저장되지 않고,
        <b>출국일·입국일만</b> 시트에 저장돼요.</div>
      <label>누구의 증명서인가요?</label>
      <div class="filters" id="certPerson"></div>
      <label>증명서 파일 (정부24에서 받은 PDF 또는 사진)</label>
      <label class="drop" id="certDrop">
        <input type="file" id="certFile" accept="application/pdf,image/*">
        <div id="certDropText">여기를 눌러 파일 선택 (또는 끌어다 놓기)</div>
      </label>
      <div id="certStatus" class="note"></div>
      <div class="progress hidden" id="certProgress"><i></i></div>
    </div>

    <div class="card hidden" id="certResult">
      <h3 style="margin-top:0" id="certSummary"></h3>
      <div class="note" style="margin:0 0 10px">글자 인식이 틀릴 수 있어요. 증명서와 한 번 비교해 보고, 틀린 날짜는 바로 고쳐 주세요.
        빨간 표시는 확인이 필요한 줄이에요.</div>
      <div style="overflow-x:auto"><table id="certTable"></table></div>
      <div class="actions">
        <button class="btn ghost" id="certAddRow">+ 줄 추가</button>
        <button class="btn" id="certSave">저장하기</button>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
  let DATA = null;
  let filterPerson = '';
  let editingId = null;
  let pickedPeople = new Set();
  let pickedCountries = [];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const flagImg = code => code ? `<img class="flag" src="https://flagcdn.com/w40/${code.toLowerCase()}.png" alt="">` : '❓';
  const chip = (c, removable) => `<span class="chip ${c.code ? '' : 'unknown'}">${flagImg(c.code)}${esc(c.name)}${
      removable ? `<button class="x" data-remove="${esc(c.name)}">×</button>` : ''}</span>`;
  const dot = s => (s || '').replace(/-/g, '.');

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Apps Script 웹앱 주소 (배포 → 배포 관리에서 복사). 시트 저장/조회만 담당합니다.
  const API_URL = 'https://script.google.com/macros/s/AKfycbxisKGyYyoV11Pw70RZEYfyTl99QTAY9NYjUJvT5sZNSQdoPpofTFJO8IEFD7cfIM_S/exec';
  const KEY_STORAGE = 'famTravelKey';

  function getKey() { try { return localStorage.getItem(KEY_STORAGE) || ''; } catch (e) { return ''; } }
  function setKey(k) { try { k ? localStorage.setItem(KEY_STORAGE, k) : localStorage.removeItem(KEY_STORAGE); } catch (e) {} }

  // Content-Type을 지정하지 않으면 text/plain으로 보내져서 CORS 사전요청 없이 Apps Script에 전달됩니다.
  async function api(action, extra) {
    let key = getKey();
    if (!key) {
      key = (prompt('가족 비밀번호를 입력해 주세요') || '').trim();
      if (!key) throw new Error('비밀번호가 필요해요');
    }
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, key }, extra)) });
    if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');
    const body = await res.json();
    if (!body.ok) {
      if (body.auth) { setKey(''); return api(action, extra); }
      throw new Error(body.error);
    }
    setKey(key);
    return body;
  }

  function showTab(name) {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
    ['stats', 'trips', 'form', 'cert'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== name));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    if (b.dataset.tab === 'form') resetForm();
    showTab(b.dataset.tab);
  });

  function findCountry(text) {
    const k = text.toLowerCase().replace(/\s+/g, '');
    return DATA.countries.find(c => c.name.replace(/\s+/g, '').toLowerCase() === k || c.code.toLowerCase() === k ||
      (c.aliases || []).some(a => a.toLowerCase().replace(/\s+/g, '') === k));
  }

  /* ── 통계 ── */
  function renderStats() {
    const s = DATA.stats;
    const byName = {}; s.countries.forEach(c => byName[c.name] = c);
    $('people').innerHTML = s.people.map(p => {
      const visited = Object.keys(p.visitCount).sort((a, b) => p.visitCount[b] - p.visitCount[a]);
      return `<div class="card person">
        <h2>${esc(p.name)} <small>${esc(p.role)}</small></h2>
        <div class="nums">
          <div><b>${p.departures}</b><span>출국 횟수</span></div>
          <div><b>${p.countryVisits}</b><span>나라 방문 횟수</span></div>
          <div><b>${p.uniqueCountries}</b><span>가본 나라</span></div>
        </div>
        <div class="flags">${visited.map(n => chip({ name: n + (p.visitCount[n] > 1 ? ' ×' + p.visitCount[n] : ''),
            code: byName[n] ? byName[n].code : '' })).join('') || '<span class="note">아직 기록이 없어요</span>'}</div>
        ${p.days ? `<div class="note">해외에서 보낸 날 총 ${p.days}일 · 최근 출국 ${dot(p.lastDep)}</div>` : ''}
        ${p.missing ? `<div class="missing">⚠️ 나라 미입력 ${p.missing}건 — 여행 목록에서 채워주세요</div>` : ''}
      </div>`;
    }).join('');

    const fam = DATA.family;
    $('countryTable').innerHTML = `<tr><th>나라</th>${fam.map(f => `<th class="c">${esc(f.name)}</th>`).join('')}<th class="c">합계</th></tr>` +
      (s.countries.map(c => `<tr><td>${chip(c)}</td>${fam.map(f => `<td class="c">${c.byPerson[f.name] || ''}</td>`).join('')}<td class="c"><b>${c.total}</b></td></tr>`).join('')
       || `<tr><td colspan="${fam.length + 2}" class="note">아직 나라가 입력된 여행이 없어요</td></tr>`);

    const years = Object.keys(s.years).sort().reverse();
    $('yearTable').innerHTML = `<tr><th>연도</th>${fam.map(f => `<th class="c">${esc(f.name)}</th>`).join('')}</tr>` +
      years.map(y => `<tr><td>${y}</td>${fam.map(f => `<td class="c">${s.years[y][f.name] || ''}</td>`).join('')}</tr>`).join('');
  }

  /* ── 여행 목록 ── */
  function renderTrips() {
    $('personFilter').innerHTML = [{ name: '' }].concat(DATA.family).map(f =>
      `<button class="pill ${filterPerson === f.name ? 'on' : ''}" data-person="${esc(f.name)}">${f.name ? esc(f.name) : '전체'}</button>`).join('');
    $('personFilter').querySelectorAll('button').forEach(b => b.onclick = () => { filterPerson = b.dataset.person; renderTrips(); });

    const trips = DATA.trips.filter(t => !filterPerson || t.person === filterPerson);
    $('tripList').innerHTML = trips.map(t => `
      <div class="trip ${t.countries.length ? '' : 'todo'}" data-id="${esc(t.id)}">
        <div>
          <div class="when">${dot(t.dep)} ~ ${dot(t.ret).slice(5) || '?'} ${t.days ? `<span class="who">(${t.days - 1}박${t.days}일)</span>` : ''}</div>
          <div class="who">${esc(t.person)}</div>
          ${t.memo ? `<div class="memo">${esc(t.memo)}</div>` : ''}
        </div>
        <div class="flags" style="justify-content:flex-end">${t.countries.map(c => chip(c)).join('') || '<span class="missing">나라 입력하기 ›</span>'}</div>
      </div>`).join('') || '<div class="note">여행 기록이 없어요</div>';
    $('tripList').querySelectorAll('.trip').forEach(el => el.onclick = () => editTrip(el.dataset.id));
  }

  /* ── 폼 ── */
  function renderPeoplePick() {
    $('peoplePick').innerHTML = DATA.family.map(f =>
      `<button class="pill ${pickedPeople.has(f.name) ? 'on' : ''}" data-person="${esc(f.name)}">${esc(f.name)}</button>`).join('');
    $('peoplePick').querySelectorAll('button').forEach(b => b.onclick = () => {
      const n = b.dataset.person;
      if (editingId) pickedPeople = new Set([n]);
      else pickedPeople.has(n) ? pickedPeople.delete(n) : pickedPeople.add(n);
      renderPeoplePick();
    });
  }

  function renderPicked() {
    $('picked').innerHTML = pickedCountries.map(c => chip(c, true)).join('');
    $('picked').querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
      pickedCountries = pickedCountries.filter(c => c.name !== b.dataset.remove); renderPicked();
    });
  }

  function addCountryFromInput() {
    const parts = $('countryInput').value.split(/[,，、/]+/).map(s => s.trim()).filter(Boolean);
    parts.forEach(p => {
      const hit = findCountry(p);
      const c = hit ? { name: hit.name, code: hit.code } : { name: p, code: '' };
      if (!hit) toast(`'${p}'은(는) 국가목록에 없어요. 그대로 저장돼요`);
      pickedCountries.push(c);   // 같은 여행에서 같은 나라를 두 번 들르는 경우도 허용
    });
    $('countryInput').value = '';
    renderPicked();
  }
  $('countryInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addCountryFromInput(); }
  });
  $('countryInput').addEventListener('change', () => { if (findCountry($('countryInput').value.trim())) addCountryFromInput(); });

  function resetForm() {
    editingId = null;
    pickedPeople = new Set(); pickedCountries = [];
    $('dep').value = $('ret').value = $('memo').value = $('countryInput').value = '';
    $('formTitle').textContent = '여행 추가';
    $('peopleHint').classList.remove('hidden');
    $('cancelBtn').classList.add('hidden'); $('deleteBtn').classList.add('hidden');
    renderPeoplePick(); renderPicked();
  }

  function editTrip(id) {
    const t = DATA.trips.find(x => x.id === id); if (!t) return;
    editingId = id;
    pickedPeople = new Set([t.person]);
    pickedCountries = t.countries.slice();
    $('dep').value = t.dep; $('ret').value = t.ret; $('memo').value = t.memo; $('countryInput').value = '';
    $('formTitle').textContent = '여행 수정';
    $('peopleHint').classList.add('hidden');
    $('cancelBtn').classList.remove('hidden'); $('deleteBtn').classList.remove('hidden');
    renderPeoplePick(); renderPicked();
    showTab('form');
    $('countryInput').focus();
  }

  $('cancelBtn').onclick = () => showTab('trips');

  $('saveBtn').onclick = async () => {
    if ($('countryInput').value.trim()) addCountryFromInput();
    const people = [...pickedPeople];
    if (!people.length) return toast('누가 갔는지 선택해 주세요');
    if (!$('dep').value) return toast('출국일을 입력해 주세요');
    const payload = { people, person: people[0], dep: $('dep').value, ret: $('ret').value,
                      countries: pickedCountries.map(c => c.name), memo: $('memo').value.trim() };
    $('saveBtn').disabled = true;
    try {
      const res = editingId ? await api('update', { id: editingId, trip: payload }) : await api('add', { trip: payload });
      DATA = res.data; renderAll();
      if (res.skipped && res.skipped.length) toast(`${res.skipped.join(', ')}: 같은 출국일 기록이 이미 있어서 건너뛰었어요`);
      else toast('저장했어요 ✈️');
      showTab(editingId ? 'trips' : 'stats');
      resetForm();
    } catch (e) { toast('오류: ' + e.message); }
    finally { $('saveBtn').disabled = false; }
  };

  $('deleteBtn').onclick = async () => {
    if (!editingId || !confirm('이 여행 기록을 삭제할까요?')) return;
    try { DATA = (await api('delete', { id: editingId })).data; renderAll(); toast('삭제했어요'); showTab('trips'); resetForm(); }
    catch (e) { toast('오류: ' + e.message); }
  };


  /* ── 출입국증명서 불러오기 ──
     PDF에 글자 정보가 있으면 그대로 읽고, 스캔본이면 브라우저 안에서 OCR(Tesseract)로 읽습니다.
     파일은 서버로 보내지 않습니다. */
  const LIB = {
    pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
    pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    tessWorker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
    tessCore: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
    tessLang: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int',
  };
  let certPerson = '';
  let certRows = [];   // [{ dep, ret }]
  const loaded = {};
  function loadScript(src) {
    return loaded[src] || (loaded[src] = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('라이브러리를 불러오지 못했어요'));
      document.head.appendChild(el);
    }));
  }

  function certProgress(text, ratio) {
    $('certStatus').textContent = text;
    $('certProgress').classList.toggle('hidden', ratio == null);
    if (ratio != null) $('certProgress').firstElementChild.style.width = Math.round(ratio * 100) + '%';
  }

  function renderCertPerson() {
    $('certPerson').innerHTML = DATA.family.map(f =>
      `<button class="pill ${certPerson === f.name ? 'on' : ''}" data-person="${esc(f.name)}">${esc(f.name)}</button>`).join('');
    $('certPerson').querySelectorAll('button').forEach(b => b.onclick = () => {
      certPerson = b.dataset.person; renderCertPerson(); if (certRows.length) renderCertTable();
    });
  }

  // 'O'→0, 'l'→1 같은 OCR 오인식을 고친 뒤 날짜(yyyy.mm.dd)면 'yyyy-mm-dd' 반환
  function tokenToDate(text) {
    const t = text.replace(/[()\[\]]/g, '').replace(/[Oo]/g, '0').replace(/[lI|]/g, '1').replace(/,/g, '.');
    const m = t.match(/^((?:19|20)\d{2})[.\-](\d{2})[.\-](\d{2})\.?$/);  // 증명서는 항상 두 자리 (잘린 인식 방지)
    if (!m) return null;
    const mo = Number(m[2]), d = Number(m[3]);
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${m[1]}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  /**
   * 한 쪽의 단어 목록 [{ text, x, y, h }] (y는 위에서부터) → 출국/입국 쌍 목록
   * 표 머리글 'Departure'/'Entry' 위치로 칸을 나누고, 'Reference Period' 위쪽의 날짜만 씁니다.
   */
  function parsePage(words) {
    // 표 머리글: 같은 줄에 Departure 와 Entry 가 함께 있어야 인정 (왼쪽 'Date of Entry' 같은 글자 오인 방지)
    const heads = words.filter(w => /Departure|Entry/.test(w.text) && !/DEPARTURE|ENTRY/.test(w.text));
    let headRow = null, top = -Infinity;
    heads.slice().sort((a, b) => a.y - b.y).some(h0 => {
      const row = heads.filter(w => Math.abs(w.y - h0.y) < Math.max(h0.h, 10))
        .map(w => ({ x: w.x, kind: /Departure/.test(w.text) ? 'dep' : 'ret' })).sort((a, b) => a.x - b.x);
      if (row[0].kind === 'dep' && row.some(r => r.kind === 'ret')) { headRow = row; top = h0.y; return true; }
      return false;
    });

    // 조회기간(2000.01.01 부터 …)은 'Reference Period' 글자보다 살짝 위에 있어서 여유를 둠
    const ref = words.filter(w => /Reference|Period/.test(w.text) && w.y > top);
    const bottom = ref.length ? Math.min(...ref.map(w => w.y - w.h * 1.5)) : Infinity;
    // 같은 줄에 (from) / (to) / Issuance 가 있으면 여행 날짜가 아님
    const stops = words.filter(w => /from|\(to\)|^to\)?$|Issuance/i.test(w.text));
    const isStopRow = w => stops.some(s => Math.abs(s.y - w.y) < Math.max(w.h, s.h));

    const dates = words.map(w => Object.assign({ date: tokenToDate(w.text) }, w))
      .filter(w => w.date && w.y > top + 1 && w.y < bottom && !isStopRow(w)).sort((a, b) => a.y - b.y);
    if (!dates.length) return [];

    // 줄 묶기 (사진이 살짝 기울어도 같은 줄로 보도록 글자 높이 기준)
    let lines = [];
    dates.forEach(w => {
      const line = lines[lines.length - 1];
      if (line && Math.abs(line[0].y - w.y) < Math.max(w.h * 0.7, 6)) line.push(w); else lines.push([w]);
    });

    if (!headRow) {
      // 머리글을 못 읽은 경우: 날짜가 2개 이상인 줄부터 표로 보고, 날짜들의 x 위치로 칸을 나눔
      const multi = lines.filter(l => l.length >= 2);
      if (!multi.length) return lines.map(l => ({ dep: l[0].date, ret: '' }));
      const firstY = multi[0][0].y;
      lines = lines.filter(l => l[0].y >= firstY - 1);
      const hs = dates.map(w => w.h).sort((a, b) => a - b);
      const gap = hs[Math.floor(hs.length / 2)] * 2;
      const xs = [].concat(...multi).map(w => w.x).sort((a, b) => a - b);
      const cols = [[xs[0]]];
      xs.slice(1).forEach(x => { if (x - cols[cols.length - 1].slice(-1)[0] > gap) cols.push([x]); else cols[cols.length - 1].push(x); });
      headRow = cols.map((c, i) => ({ x: c.reduce((s, v) => s + v, 0) / c.length, kind: i % 2 ? 'ret' : 'dep' }));
    }

    const pairs = [];
    lines.forEach(line => {
      const slots = headRow.map(() => '');
      line.forEach(w => {
        let best = 0;
        headRow.forEach((h, i) => { if (Math.abs(h.x - w.x) < Math.abs(headRow[best].x - w.x)) best = i; });
        slots[best] = w.date;
      });
      for (let i = 0; i < headRow.length; i++) {
        if (headRow[i].kind !== 'dep') continue;
        const ret = headRow[i + 1] && headRow[i + 1].kind === 'ret' ? slots[i + 1] : '';
        if (slots[i] || ret) pairs.push({ dep: slots[i], ret: ret });
      }
    });
    return pairs;
  }

  async function wordsFromPdfText(page, viewport) {
    const content = await page.getTextContent();
    const words = [];
    content.items.forEach(it => {
      const [x, y] = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
      const h = Math.abs(it.transform[3]) * viewport.scale;
      // 한 덩어리에 날짜 여러 개가 붙어 있을 수 있어 공백 기준으로 나눔 (x는 글자 비율로 추정)
      const parts = it.str.split(/(\s+)/);
      let offset = 0;
      parts.forEach(part => {
        if (part.trim()) words.push({ text: part, x: x + (it.width * viewport.scale) * (offset / Math.max(it.str.length, 1)), y: y - h, h: h });
        offset += part.length;
      });
    });
    return words;
  }

  let tessWorker = null;
  let currentOcrProgress = () => {};
  async function ocrWords(canvas, onProgress) {
    await loadScript(LIB.tesseract);
    if (!tessWorker) {
      tessWorker = await Tesseract.createWorker('eng', 1, {
        workerPath: LIB.tessWorker, corePath: LIB.tessCore, langPath: LIB.tessLang,
        logger: m => { if (m.status === 'recognizing text') currentOcrProgress(m.progress); },
      });
    }
    currentOcrProgress = onProgress;
    const { data } = await tessWorker.recognize(canvas);
    return data.words.map(w => ({ text: w.text, x: w.bbox.x0, y: w.bbox.y0, h: w.bbox.y1 - w.bbox.y0 }));
  }

  async function readCertificate(file) {
    const pairs = [];
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      certProgress('PDF 여는 중…', 0);
      await loadScript(LIB.pdf);
      pdfjsLib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      for (let n = 1; n <= pdf.numPages; n++) {
        const page = await pdf.getPage(n);
        const viewport = page.getViewport({ scale: 3 });
        let found = parsePage(await wordsFromPdfText(page, viewport));
        if (!found.length) {  // 스캔본 → OCR
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
          certProgress(`${n}/${pdf.numPages}쪽 글자 읽는 중…`, (n - 1) / pdf.numPages);
          found = parsePage(await ocrWords(canvas, p => certProgress(`${n}/${pdf.numPages}쪽 글자 읽는 중…`, (n - 1 + p) / pdf.numPages)));
        }
        pairs.push(...found);
      }
    } else {
      certProgress('사진에서 글자 읽는 중…', 0);
      const img = await createImageBitmap(file);
      const scale = Math.max(1, 2400 / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      pairs.push(...parsePage(await ocrWords(canvas, p => certProgress('사진에서 글자 읽는 중…', p))));
    }
    return pairs.sort((a, b) => (a.dep || a.ret).localeCompare(b.dep || b.ret));
  }

  function certRowStatus(r, i) {
    if (!r.dep) return ['warn', '출국일 없음'];
    if (!r.ret && i < certRows.length - 1) return ['warn', '입국일 없음'];
    if (r.ret && r.ret < r.dep) return ['warn', '입국일이 더 빠름'];
    if (r.ret && (new Date(r.ret) - new Date(r.dep)) / 86400000 > 180) return ['warn', '기간이 너무 김'];
    const prev = certRows[i - 1];
    if (prev && prev.ret && prev.ret > r.dep) return ['warn', '앞 여행과 겹침'];
    if (certPerson && DATA.trips.some(t => t.person === certPerson && t.dep === r.dep)) return ['dup', '이미 있음'];
    return ['new', '새로 추가'];
  }

  function renderCertTable() {
    const statuses = certRows.map(certRowStatus);
    const count = k => statuses.filter(s => s[0] === k).length;
    $('certSummary').textContent = `출국 ${certRows.length}건을 찾았어요` +
      (certPerson ? ` · 새로 ${count('new') + count('warn')}건` + (count('dup') ? `, 이미 있음 ${count('dup')}건` : '') : '');
    $('certTable').innerHTML = `<tr><th>출국일</th><th>입국일</th><th></th><th></th></tr>` +
      certRows.map((r, i) => `<tr${statuses[i][0] === 'warn' ? ' style="background:#fff5f5"' : ''}>
        <td><input type="date" data-i="${i}" data-k="dep" value="${esc(r.dep)}"></td>
        <td><input type="date" data-i="${i}" data-k="ret" value="${esc(r.ret)}"></td>
        <td><span class="tag ${statuses[i][0]}">${{ new: '새로', dup: '있음', warn: '⚠️' }[statuses[i][0]]}</span></td>
        <td><button class="delx" data-del="${i}" title="이 줄 지우기">✕</button></td></tr>` +
        (statuses[i][0] === 'warn' ? `<tr class="warnrow"><td colspan="4"><span class="tag warn">${statuses[i][1]} — 증명서와 비교해 고쳐 주세요</span></td></tr>` : '')).join('');
    $('certTable').querySelectorAll('input').forEach(el => el.onchange = () => {
      certRows[el.dataset.i][el.dataset.k] = el.value; renderCertTable();
    });
    $('certTable').querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      certRows.splice(Number(b.dataset.del), 1); renderCertTable();
    });
    $('certResult').classList.remove('hidden');
  }

  async function handleCertFile(file) {
    if (!file) return;
    $('certDropText').textContent = file.name;
    $('certResult').classList.add('hidden');
    try {
      certRows = await readCertificate(file);
      certProgress(certRows.length ? '다 읽었어요. 아래 날짜를 확인해 주세요.' : '날짜를 찾지 못했어요. 선명한 파일인지 확인하거나 줄을 직접 추가해 주세요.', null);
      renderCertTable();
    } catch (e) {
      certProgress('읽기 실패: ' + e.message, null);
    } finally {
      $('certFile').value = '';
    }
  }

  $('certFile').onchange = () => handleCertFile($('certFile').files[0]);
  ['dragover', 'dragenter'].forEach(t => $('certDrop').addEventListener(t, e => { e.preventDefault(); $('certDrop').classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => $('certDrop').addEventListener(t, e => { e.preventDefault(); $('certDrop').classList.remove('over'); }));
  $('certDrop').addEventListener('drop', e => handleCertFile(e.dataTransfer.files[0]));
  $('certAddRow').onclick = () => { certRows.push({ dep: '', ret: '' }); renderCertTable(); };

  $('certSave').onclick = async () => {
    if (!certPerson) return toast('누구의 증명서인지 먼저 선택해 주세요');
    if (certRows.some(r => !r.dep && r.ret)) return toast('출국일이 빈 줄이 있어요. 날짜를 고치거나 ✕로 지워 주세요');
    const noRet = certRows.filter((r, i) => r.dep && !r.ret && i < certRows.length - 1).length;
    if (noRet && !confirm(`입국일이 빈 줄이 ${noRet}개 있어요. 그대로 저장할까요?`)) return;
    const rows = certRows.filter(r => r.dep);
    if (!rows.length) return toast('저장할 날짜가 없어요');
    $('certSave').disabled = true;
    try {
      const res = await api('import', { person: certPerson, trips: rows });
      DATA = res.data; renderAll();
      toast(`${res.added}건 저장했어요` + (res.skipped ? ` (이미 있던 ${res.skipped}건은 건너뜀)` : '') + '. 이제 나라를 채워 주세요!');
      filterPerson = certPerson; certRows = [];
      $('certResult').classList.add('hidden'); $('certDropText').textContent = '여기를 눌러 파일 선택 (또는 끌어다 놓기)';
      certProgress('', null);
      renderTrips(); showTab('trips');
    } catch (e) { toast('오류: ' + e.message); }
    finally { $('certSave').disabled = false; }
  };

  function renderAll() {
    $('countryList').innerHTML = DATA.countries.map(c => `<option value="${esc(c.name)}">`).join('');
    renderStats(); renderTrips(); renderPeoplePick(); renderCertPerson();
  }

  api('get').then(res => {
    DATA = res.data; $('loading').classList.add('hidden'); renderAll(); resetForm(); showTab('stats');
  }).catch(e => { $('loading').textContent = '불러오기 실패: ' + e.message + ' — 새로고침 해 주세요'; });
</script>
</body>
</html>
